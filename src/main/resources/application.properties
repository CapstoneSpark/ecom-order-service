spring.application.name=OrderProcessingMicroService
server.port=8084

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/orders?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect



app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION}

# External services
product.service.url=http://localhost:8082/api/v1/products
payment.service.url=http://localhost:8085/api/v1/payments

orders.idempotency.enabled=true

logging.level.com.example.orderservice=DEBUG

