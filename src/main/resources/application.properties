spring.application.name=OrderProcessingMicroService
server.port=8084

spring.profiles.active=dev


# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/orders?useSSL=false&serverTimezone=UTC
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect



app.jwtSecret=
app.jwtExpirationMs=

# External services
product.service.url=
payment.service.url=

orders.idempotency.enabled=true

logging.level.com.example.orderservice=DEBUG
